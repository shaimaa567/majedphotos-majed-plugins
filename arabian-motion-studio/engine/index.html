<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Arabian Motion Studio — engine</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; box-sizing: border-box; will-change: transform, opacity; }
  .layer svg { display: block; overflow: visible; }
  .txt { display: block; margin: 0; }
  .w { display: inline-block; white-space: pre; }
  .w.ltr { direction: ltr; unicode-bidi: isolate; }
  #dbg { position: absolute; left: 12px; top: 12px; z-index: 99999; font: 700 44px monospace; color: #0f0;
         background: rgba(0,0,0,.7); padding: 4px 10px; direction: ltr; display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="dbg"></div>
<script src="runtime.js"></script>
</body>
</html>
